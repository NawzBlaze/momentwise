<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <style>
    :root {
      --bg: #FAF7F2;
      --m: #14291E;
      --sun: #C28B38;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0F1412;
        --m: #EDF2EE;
        --sun: #E2AC54;
      }
    }
    .bg { fill: var(--bg); }
    .sun { fill: var(--sun); }
    .m-path { stroke: var(--m); }
  </style>
  <rect class="bg" width="32" height="32" rx="8"/>
  <!-- Rising sun cradled by the M -->
  <circle class="sun" cx="16" cy="11.5" r="4.5"/>
  <!-- Distinctive M-shaped silhouette -->
  <path class="m-path" d="M6 24V13.5C6 11 8 9.5 10.5 11L16 16.5L21.5 11C24 9.5 26 11 26 13.5V24" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
