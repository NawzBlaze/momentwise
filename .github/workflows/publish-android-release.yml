name: Publish signed Android release

# Manual dispatch only. Never add a pull request or tag trigger.
# This is the only workflow that may create a GitHub Release.
# It updates website metadata only after the signed APK is verified and a
# matching public release exists, then waits for the Pages deployment.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Use publish-after-physical-approval only after device testing, or publish-unverified-at-owner-risk to disclose that device testing is pending.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-android-release
  cancel-in-progress: false

jobs:
  guard:
    name: Require main and the approval phrase
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail before secrets unless this is an approved main dispatch
        env:
          PUBLISH_CONFIRMATION: ${{ github.event.inputs.confirmation }}
        run: |
          python3 - <<'PY'
          import os, sys
          if os.environ.get("GITHUB_EVENT_NAME") != "workflow_dispatch":
              sys.exit("Not a manual run. No signing secret was read.")
          if os.environ.get("GITHUB_REF") != "refs/heads/main":
              sys.exit("Refusing %s. Only refs/heads/main may continue. No signing secret was read." % os.environ.get("GITHUB_REF"))
          if os.environ.get("PUBLISH_CONFIRMATION") not in {"publish-after-physical-approval", "publish-unverified-at-owner-risk"}:
              sys.exit("Confirmation phrase did not match. No release was created and no signing secret was read.")
          if os.environ.get("PUBLISH_CONFIRMATION") == "publish-after-physical-approval":
              print("Physical-device approval selected on main. This job does not read signing secrets.")
          else:
              print("Owner explicitly selected publication before physical-device validation. This job does not read signing secrets.")
          PY

  publish:
    name: Build, verify, and publish the signed release
    needs: guard
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (github.event.inputs.confirmation == 'publish-after-physical-approval' || github.event.inputs.confirmation == 'publish-unverified-at-owner-risk')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Confirm the approval phrase before secrets
        env:
          PUBLISH_CONFIRMATION: ${{ github.event.inputs.confirmation }}
        run: |
          python3 - <<'PY'
          import os, sys
          if os.environ.get("GITHUB_EVENT_NAME") != "workflow_dispatch" or os.environ.get("GITHUB_REF") != "refs/heads/main":
              sys.exit("Refusing before any signing secret is read.")
          if os.environ.get("PUBLISH_CONFIRMATION") not in {"publish-after-physical-approval", "publish-unverified-at-owner-risk"}:
              sys.exit("Confirmation phrase did not match. No release was created.")
          if os.environ.get("PUBLISH_CONFIRMATION") == "publish-after-physical-approval":
              print("Physical-device approval confirmed on main; confirmation text is not printed.")
          else:
              print("Untested publication expressly selected by owner; confirmation text is not printed.")
          PY

      - name: Checkout main
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Require signing secrets
        if: success() && github.ref == 'refs/heads/main'
        env:
          MOMENTWISE_KEYSTORE_BASE64: ${{ secrets.MOMENTWISE_KEYSTORE_BASE64 }}
          MOMENTWISE_KEYSTORE_PASSWORD: ${{ secrets.MOMENTWISE_KEYSTORE_PASSWORD }}
          MOMENTWISE_KEY_ALIAS: ${{ secrets.MOMENTWISE_KEY_ALIAS }}
          MOMENTWISE_KEY_PASSWORD: ${{ secrets.MOMENTWISE_KEY_PASSWORD }}
        run: bash .github/scripts/require-signing-secrets.sh

      - name: Set up JDK 17
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        if: success() && github.ref == 'refs/heads/main'
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0

      - name: Decode existing keystore
        if: success() && github.ref == 'refs/heads/main'
        env:
          MOMENTWISE_KEYSTORE_BASE64: ${{ secrets.MOMENTWISE_KEYSTORE_BASE64 }}
        run: bash .github/scripts/decode-keystore.sh

      - name: Assemble signed release
        if: success() && github.ref == 'refs/heads/main'
        working-directory: android
        env:
          MOMENTWISE_KEYSTORE_PATH: ${{ runner.temp }}/signing/momentwise-release.jks
          MOMENTWISE_KEYSTORE_PASSWORD: ${{ secrets.MOMENTWISE_KEYSTORE_PASSWORD }}
          MOMENTWISE_KEY_ALIAS: ${{ secrets.MOMENTWISE_KEY_ALIAS }}
          MOMENTWISE_KEY_PASSWORD: ${{ secrets.MOMENTWISE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signature, package, and version
        if: success() && github.ref == 'refs/heads/main'
        run: bash .github/scripts/verify-signed-apk.sh

      - name: Prepare website metadata for the verified 1.0.1 release
        if: success() && github.ref == 'refs/heads/main'
        env:
          PUBLISH_CONFIRMATION: ${{ github.event.inputs.confirmation }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          checksum_file = Path("signed-artifact/Momentwise.apk.sha256")
          digest = checksum_file.read_text(encoding="utf-8").split()[0]
          if not re.fullmatch(r"[a-f0-9]{64}", digest):
              raise SystemExit("The verified APK checksum is not a SHA-256 digest.")
          unverified = os.environ.get("PUBLISH_CONFIRMATION") == "publish-unverified-at-owner-risk"
          validation = (
              "Physical-device testing with Instagram is still pending."
              if unverified
              else "Published after the owner-selected physical-device approval path."
          )
          path = Path("download.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data.update({
              "available": True,
              "gate": "Enabled for the published signed GitHub Release v1.0.1. Automated unit, lint and API 34/35 emulator checks passed. " + validation,
              "unavailableMessage": "A signed download is available below.",
              "versionName": "1.0.1",
              "versionCode": 13,
              "packageId": "com.nawzblaze.momentwise",
              "apkUrl": "https://github.com/NawzBlaze/momentwise/releases/download/v1.0.1/Momentwise.apk",
              "sha256": digest,
              "checksumUrl": "https://github.com/NawzBlaze/momentwise/releases/download/v1.0.1/Momentwise.apk.sha256",
              "verificationReportUrl": "https://github.com/NawzBlaze/momentwise/releases/download/v1.0.1/signing-verification.txt",
              "releaseUrl": "https://github.com/NawzBlaze/momentwise/releases/tag/v1.0.1",
              "notes": "Momentwise 1.0.1 (versionCode 13). Automated unit, lint and API 34/35 fixture-emulator checks passed. " + validation + " Review the release notes before installing."
          })
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
          python3 .github/scripts/check-site.py

      - name: Remove keystore
        if: always() && github.ref == 'refs/heads/main'
        run: rm -f "$RUNNER_TEMP/signing/momentwise-release.jks"

      - name: Upload verified files for this run
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: momentwise-signed-apk-not-the-website-download
          path: |
            signed-artifact/Momentwise.apk
            signed-artifact/Momentwise.apk.sha256
            signed-artifact/signing-verification.txt
          if-no-files-found: error

      - name: Write release notes
        if: success() && github.ref == 'refs/heads/main'
        env:
          PUBLISH_CONFIRMATION: ${{ github.event.inputs.confirmation }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          Momentwise 1.0.1 (versionCode 13)

          Signed Android build of Momentwise with the redesigned opening-pause and reminder surfaces, plus target-app-only overlay attachment and quick-return recovery for an unanswered opening pause. The pause is branded Momentwise; it does not impersonate an official Instagram screen.

          The APK was checked with apksigner before publication. The SHA-256 and release certificate fingerprint are in the attached verification report.

          Limits: Momentwise does not force-stop other apps, does not block taps, and does not promise an exact clock time for reminders. Reminder checks can arrive about 15 seconds after the interval while monitoring is on. The pause overlay needs display-over-other-apps permission. A foreground notification stays visible while monitoring is on.

          Automated Android unit tests, lint and API 34/35 fixture-emulator checks passed. Physical-device validation status is recorded below.
          EOF
          if [ "$PUBLISH_CONFIRMATION" = "publish-unverified-at-owner-risk" ]; then
            cat >> "$RUNNER_TEMP/release-notes.md" <<'EOF'

          ## Validation status

          This build is being published at the owner's explicit request before physical-device validation. Unit tests and API 34/35 fixture-emulator tests passed, but the updated opening-pause and reminder behavior has not been verified with Instagram on a physical phone. A prior candidate showed intermittent opening-pause and reminder problems. Treat this release as unverified on real devices and expect a follow-up if further issues are found.
          EOF
          elif [ "$PUBLISH_CONFIRMATION" = "publish-after-physical-approval" ]; then
            cat >> "$RUNNER_TEMP/release-notes.md" <<'EOF'

          ## Validation status

          Published after the owner selected the physical-device approval path. Automated tests also passed for Android unit tests and API 34/35 fixture-emulator behavior.
          EOF
          fi

      - name: Create the new public release without overwriting an existing build
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v1.0.1"
          apk="signed-artifact/Momentwise.apk"
          checksum="signed-artifact/Momentwise.apk.sha256"
          report="signed-artifact/signing-verification.txt"
          test -s "$apk"
          test -s "$checksum"
          test -s "$report"
          expected="$(awk '{print $1}' "$checksum")"
          if gh release view "$tag" >/dev/null 2>&1; then
            existing_dir="$RUNNER_TEMP/existing-momentwise-release"
            mkdir -p "$existing_dir"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern "Momentwise.apk" \
              --pattern "Momentwise.apk.sha256" \
              --pattern "signing-verification.txt" \
              --dir "$existing_dir"
            test -s "$existing_dir/Momentwise.apk.sha256"
            test -s "$existing_dir/signing-verification.txt"
            existing="$(sha256sum "$existing_dir/Momentwise.apk" | awk '{print $1}')"
            existing_checksum="$(awk '{print $1}' "$existing_dir/Momentwise.apk.sha256")"
            if [ "$existing" != "$expected" ] || [ "$existing_checksum" != "$expected" ]; then
              echo "::error::Release $tag has mismatched APK/checksum bytes. Refusing to change the existing release."
              exit 1
            fi
            echo "Release $tag contains the exact verified APK and matching checksum; reusing it without overwriting assets."
          else
            gh release create "$tag" \
              "$apk" \
              "$checksum" \
              "$report" \
              --title "Momentwise 1.0.1" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Commit the verified download metadata to main
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git add download.json
          if git diff --cached --quiet; then
            echo "download.json already matches the verified v1.0.1 release."
          else
            git commit -m "Publish Momentwise 1.0.1 download metadata"
            git push origin HEAD:main
          fi

      - name: Deploy and wait for the updated download page
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          before="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --branch main --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
          run_id=""
          for attempt in $(seq 1 60); do
            candidate="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --branch main --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ -n "$candidate" ] && [ "$candidate" != "$before" ] && [ "$candidate" != "0" ]; then
              run_id="$candidate"
              break
            fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "::error::Could not find the Pages deployment dispatched after publishing v1.0.1."
            exit 1
          fi
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Record published release details
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Published release"
            echo
            echo "The signed v1.0.1 APK was verified, published without overwriting v1.0.0, and download.json was updated from its actual SHA-256. Pages deployment completed before this run succeeds."
            echo
            gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" --json url,tagName,assets
          } >> "$GITHUB_STEP_SUMMARY"
