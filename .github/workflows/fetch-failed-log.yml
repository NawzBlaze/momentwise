name: Fetch failed Android log

# One-shot relay. This workspace cannot read Actions log blobs. The runner can.
# pull_request is only so this branch can run it; the file is removed after the excerpt lands.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  fetch:
    name: Post the failed unit-test log
    runs-on: ubuntu-latest
    steps:
      - name: Download and excerpt the failed run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oldlogs"
          gh run view 39263869260 --repo NawzBlaze/momentwise --log > "$RUNNER_TEMP/oldlogs/full.log"
          wc -c "$RUNNER_TEMP/oldlogs/full.log"
          python3 - "$RUNNER_TEMP/oldlogs/full.log" "$RUNNER_TEMP/oldlogs/excerpt.md" <<'PY'
          import sys
          log_path, out_path = sys.argv[1], sys.argv[2]
          log = open(log_path, errors="replace").read()
          lines = log.splitlines()
          keys = (
              "e: ",
              "FAILED",
              "FAILURE:",
              "What went wrong",
              "Execution failed",
              "Caused by:",
              "error:",
              "ERROR:",
              "Unresolved reference",
              "tests completed",
              "BUILD ",
              "There were failing tests",
              "AssertionError",
              "Exception",
              "not mocked",
              "Stub!",
              "Could not resolve",
              "Process completed",
          )
          picked = [ln for ln in lines if any(k in ln for k in keys)]
          body = [
              "<!-- momentwise-old-failure-log -->",
              "Excerpt of run 39263869260 (f806e0a), unit-test step.",
              "",
              f"Full log lines: {len(lines)}",
              "",
              "### Matching lines",
              "```",
              *(picked[-220:] or ["(no matching lines)"]),
              "```",
              "",
              "### Tail",
              "```",
              *lines[-120:],
              "```",
              "",
          ]
          text = "\n".join(body)
          if len(text) > 60000:
              text = text[:200] + "\n\n...(truncated)...\n\n" + text[-58000:]
          open(out_path, "w", encoding="utf-8").write(text)
          print(text[-8000:])
          PY
          gh pr comment 1 --repo NawzBlaze/momentwise --body-file "$RUNNER_TEMP/oldlogs/excerpt.md"
