name: Android

on:
  pull_request:
    paths-ignore:
      - visual-review/**
  push:
    branches: [main]

# The site workflow and this one can run together. They do not share artifacts.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# pull-requests + checks write so a failed Gradle run can publish its tail.
# Actions log blobs are not readable from every review environment.
permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: write

jobs:
  check:
    name: Unit tests, debug APK, lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0

      - name: Unit tests, assemble, lint
        id: gradle
        working-directory: android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :app:lintDebug --continue --stacktrace --no-daemon > "$RUNNER_TEMP/gradle.log" 2>&1
          code=$?
          python3 - "$RUNNER_TEMP/gradle.log" "$RUNNER_TEMP/excerpt.md" "$code" <<'PY'
          import sys
          log_path, out_path, code = sys.argv[1], sys.argv[2], sys.argv[3]
          log = open(log_path, errors="replace").read()
          lines = log.splitlines()
          keys = (
              "e: ",
              "FAILED",
              "FAILURE:",
              "What went wrong",
              "Execution failed",
              "Caused by:",
              "error:",
              "Error:",
              "ERROR:",
              "Lint found errors",
              "Unresolved reference",
              "tests completed",
              "BUILD ",
          )
          picked = [ln for ln in lines if any(k in ln for k in keys) and not ln.startswith("Downloading ")]
          # Keep the signal, not the download progress.
          body = [
              "<!-- momentwise-gradle-log -->",
              f"Gradle exit code: {code}",
              "",
              "### Matching lines",
              "```",
              *(picked[-180:] or ["(no matching lines)"]),
              "```",
              "",
              "### Tail",
              "```",
              *lines[-80:],
              "```",
              "",
          ]
          text = "\n".join(body)
          if len(text) > 60000:
              text = text[:200] + "\n\n...(truncated)...\n\n" + text[-58000:]
          open(out_path, "w", encoding="utf-8").write(text)
          print(text[-12000:])
          PY
          # Success is the check itself. Only publish the excerpt when Gradle fails,
          # so a green run does not leave a log dump on the pull request.
          if [ "$code" != "0" ] && [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/excerpt.md" || echo "PR comment failed"
          fi
          if [ "$code" != "0" ]; then
          python3 - "$RUNNER_TEMP/excerpt.md" "$code" <<'PY'
          import json, os, subprocess, sys
          excerpt = open(sys.argv[1], encoding="utf-8").read()
          code = sys.argv[2]
          payload = {
              "name": "Gradle log excerpt",
              "head_sha": os.environ["HEAD_SHA"],
              "status": "completed",
              "conclusion": "success" if code == "0" else "failure",
              "output": {
                  "title": "Gradle excerpt",
                  "summary": excerpt[:65000],
              },
          }
          repo = os.environ["GITHUB_REPOSITORY"]
          proc = subprocess.run(
              ["gh", "api", f"repos/{repo}/check-runs", "--input", "-"],
              input=json.dumps(payload),
              text=True,
              capture_output=True,
          )
          if proc.returncode != 0:
              print(proc.stderr[-2000:])
              print("check-run publish failed")
          else:
              print("check-run published")
          PY
          fi
          {
            echo "## Gradle excerpt"
            echo
            cat "$RUNNER_TEMP/excerpt.md"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Record poll measurement
        if: success()
        working-directory: android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          file=$(find . -name poll-measure.txt -print -quit)
          if [ -z "$file" ]; then
            echo "No poll measurement was written."
            exit 0
          fi
          text=$(cat "$file")
          echo "$text"
          if [ -n "${PR_NUMBER:-}" ]; then
            gh pr comment "$PR_NUMBER" --body "$(printf '%s\n' '<!-- momentwise-poll-measure -->' "$text" '' 'Pure reducer on the CI JVM. Not UsageStats IPC, and not a phone measurement.')" || echo "poll comment failed"
          fi
          python3 - "$text" <<'PY'
          import json, os, subprocess, sys
          text = sys.argv[1]
          payload = {
              "name": "Poll measurement",
              "head_sha": os.environ["HEAD_SHA"],
              "status": "completed",
              "conclusion": "success",
              "output": {
                  "title": "Reducer cost versus the one-second poll",
                  "summary": text + "\n\nThis is the pure reducer on the CI JVM. It is not UsageStats IPC and not a phone measurement.",
              },
          }
          repo = os.environ["GITHUB_REPOSITORY"]
          proc = subprocess.run(
              ["gh", "api", f"repos/{repo}/check-runs", "--input", "-"],
              input=json.dumps(payload),
              text=True,
              capture_output=True,
          )
          if proc.returncode != 0:
              print(proc.stderr[-2000:])
              print("poll measurement check-run failed")
          else:
              print("poll measurement published")
          PY

      - name: Discard unsigned release output
        if: success()
        run: |
          rm -f android/app/build/outputs/apk/release/app-release.apk \
                android/app/build/outputs/apk/release/app-release-unsigned.apk
          echo "Unsigned release output was not uploaded."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: momentwise-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  site:
    name: Static site checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy, links, and structure
        run: python3 .github/scripts/check-site.py
