name: Android release

# Builds a signed release only when a stable keystore is present as secrets.
# It does not create a key, and it does not publish an unsigned or debug APK.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  signed-release:
    name: Signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require signing secrets
        id: secrets
        env:
          KEYSTORE: ${{ secrets.MOMENTWISE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MOMENTWISE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOMENTWISE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOMENTWISE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Signing secrets are not configured. No release APK will be published."
            echo "Required secrets: MOMENTWISE_KEYSTORE_BASE64, MOMENTWISE_KEYSTORE_PASSWORD, MOMENTWISE_KEY_ALIAS, MOMENTWISE_KEY_PASSWORD."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        if: steps.secrets.outputs.ready == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0

      - name: Decode keystore
        if: steps.secrets.outputs.ready == 'true'
        env:
          KEYSTORE: ${{ secrets.MOMENTWISE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/momentwise-release.jks"
          test -s "$RUNNER_TEMP/momentwise-release.jks"

      - name: Unit tests before signing
        if: steps.secrets.outputs.ready == 'true'
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace

      - name: Assemble signed release
        if: steps.secrets.outputs.ready == 'true'
        working-directory: android
        env:
          MOMENTWISE_KEYSTORE_PATH: ${{ runner.temp }}/momentwise-release.jks
          MOMENTWISE_KEYSTORE_PASSWORD: ${{ secrets.MOMENTWISE_KEYSTORE_PASSWORD }}
          MOMENTWISE_KEY_ALIAS: ${{ secrets.MOMENTWISE_KEY_ALIAS }}
          MOMENTWISE_KEY_PASSWORD: ${{ secrets.MOMENTWISE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signature and checksum
        if: steps.secrets.outputs.ready == 'true'
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" Momentwise.apk
          sha256sum Momentwise.apk | tee Momentwise.apk.sha256

      - name: Upload signed APK
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Momentwise-signed
          path: |
            Momentwise.apk
            Momentwise.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.secrets.outputs.ready == 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" Momentwise.apk Momentwise.apk.sha256 \
            --title "Momentwise ${GITHUB_REF_NAME}" \
            --notes "$(printf '%s\n' 'Signed release candidate. Not a Google Play listing.' 'The opening-pause flash has not been confirmed on a physical phone by this workflow.' 'Android will ask you to allow installation from this source.' 'A debug build signed with a different key cannot be updated by this APK. Uninstalling a debug build deletes its local rules.' '' 'SHA-256:' "$(cat Momentwise.apk.sha256)")"
