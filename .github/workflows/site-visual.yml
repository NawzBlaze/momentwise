name: Site visual check

on:
  pull_request:
    paths-ignore:
      - visual-review/**
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: site-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Browser screenshots and overflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Lighthouse
        run: npm install --prefix "$RUNNER_TEMP/visual" playwright lighthouse

      - name: Install Chromium
        run: npx --prefix "$RUNNER_TEMP/visual" playwright install --with-deps chromium

      - name: Render, screenshot, and measure
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/visual/node_modules/playwright/index.js
          LIGHTHOUSE_BIN: ${{ runner.temp }}/visual/node_modules/.bin/lighthouse
        run: |
          set +e
          node .github/scripts/capture-site.mjs > site-screenshots-log.txt 2>&1
          code=$?
          mkdir -p site-screenshots
          cp site-screenshots-log.txt site-screenshots/console.txt
          {
            echo "## Visual log"
            echo
            echo '```'
            tail -n 120 site-screenshots-log.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Publish review screenshots
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ ! -d visual-review ] || [ -z "$(ls -A visual-review 2>/dev/null)" ]; then
            echo "no review images"
            exit 0
          fi
          git config user.name "momentwise-visual"
          git config user.email "visual@users.noreply.github.com"
          git add -f visual-review
          if git diff --cached --quiet; then
            echo "no screenshot changes"
            exit 0
          fi
          git commit -m "Add browser screenshots for review [skip ci]"
          git push origin HEAD:"${{ github.head_ref }}"

      - name: Comment with the visual log
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          marker='<!-- momentwise-visual -->'
          tail_text=$(tail -n 80 site-screenshots-log.txt 2>/dev/null || echo 'no visual log')
          review_files=$(find visual-review -type f -printf '%f\n' 2>/dev/null | sort | head -40)
          gh pr comment "${{ github.event.pull_request.number }}" --body "$(printf '%s\n' "$marker" 'Visual check log tail:' '```' "$tail_text" '```' '' 'Review files:' '```' "$review_files" '```')"

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshots
          path: site-screenshots
          if-no-files-found: warn
