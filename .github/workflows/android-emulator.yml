name: Android emulator

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  instrumented:
    name: API ${{ matrix.api-level }} instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 35]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Instrumented test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_atd
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash android/run-instrumented.sh

      - name: Publish failure excerpt
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          API_LEVEL: ${{ matrix.api-level }}
        run: |
          set +e
          log="${GITHUB_WORKSPACE}/emulator-test.log"
          {
            echo "<!-- momentwise-emulator-log api-${API_LEVEL} -->"
            echo "API ${API_LEVEL} instrumentation failed."
            echo
            echo '```'
            if [ -f "$log" ]; then
              grep -E 'FAILED|FAILURE:|What went wrong|e: |error:|Exception|BUILD ' "$log" | tail -n 80
            else
              echo "No emulator log was written."
            fi
            echo '```'
          } > "$RUNNER_TEMP/emu.md"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/emu.md"
